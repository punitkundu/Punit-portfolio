<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin - Punit Kundu</title>
<style>
:root{--bg:#0d1420;--card:#16202f;--line:#2a3750;--txt:#e8e4dc;--mut:#8e9bb0;--cu:#c8854a;--red:#d9534f}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--txt)}
[hidden]{display:none!important}
.box{max-width:380px;margin:12vh auto;padding:28px;background:var(--card);border:1px solid var(--line);border-radius:14px}
h1,h2{margin:0 0 14px;color:var(--cu)}
input,textarea,select,button{font:inherit;width:100%;padding:10px 12px;margin:6px 0 12px;border-radius:8px;border:1px solid var(--line);background:#0f1826;color:var(--txt)}
textarea{min-height:90px;resize:vertical}
button{background:var(--cu);color:#1a1209;font-weight:700;border:0;cursor:pointer;width:auto;padding:10px 18px;margin:0}
button.sec{background:transparent;color:var(--txt);border:1px solid var(--line)}
button.del{background:var(--red);color:#fff}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
nav{display:flex;gap:8px;flex-wrap:wrap;padding:14px 20px}
nav button{background:transparent;color:var(--txt);border:1px solid var(--line)}
nav button.on{background:var(--cu);color:#1a1209}
main{max-width:900px;margin:0 auto;padding:0 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row small{color:var(--mut);display:block;margin-top:4px;word-break:break-word}
.row .act{display:flex;gap:8px;flex-shrink:0}
label{font-size:13px;color:var(--mut)}
img.pv{max-width:140px;border-radius:8px;display:block;margin-bottom:8px}
#msg{color:var(--mut);min-height:20px;margin-bottom:8px}
</style>
</head>
<body>

<div id="login" class="box" hidden>
  <h1>Admin Login</h1>
  <label>Email</label><input id="em" type="email" autocomplete="username">
  <label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <button id="lbtn">Login</button>
  <div id="lerr" style="color:var(--red);margin-top:10px"></div>
</div>

<div id="app" hidden>
  <header><strong>Punit Kundu - Admin</strong><button class="sec" id="out">Logout</button></header>
  <nav id="nav"></nav>
  <main>
    <div id="msg"></div>
    <div class="card" id="formCard" hidden><h2 id="ftitle"></h2><div id="fields"></div>
      <button id="save">Save</button> <button class="sec" id="cancel">Cancel</button></div>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center">
      <h2 id="ltitle" style="margin:0"></h2><button id="add">+ Add new</button></div>
      <div id="list"></div></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====== STEP 1: apni Supabase details yahan daalo (Project Settings > API) ======
const SUPABASE_URL = 'https://jfkwbegzgjojypflcefx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impma3diZWd6Z2pvanlwZmxjZWZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU0OTMzMDQsImV4cCI6MjExMTA2OTMwNH0.-Xrxu82pnSYD8CC-Dul1Djx7rz6Qyno5pQ0FkgYira4';
// ================================================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// field = [column, label, type]
const T = {
  profiles:{label:'Profile',title:'name',sub:'role',order:'name',f:[['name','Name'],['from_location','From'],['role','Role'],['company','Company'],['program','Program'],['institution','Institution'],['interests','Interests'],['email','Email']]},
  projects:{label:'Projects',title:'title',sub:'description',order:'display_order',f:[['category','Category'],['title','Title'],['description','Description','textarea'],['link_url','Link (URL)'],['image_url','Image','image'],['display_order','Order (1,2,3...)','number']]},
  experience:{label:'Experience',title:'title',sub:'description',order:'display_order',f:[['title','Title'],['description','Description','textarea'],['ball_color','Ball color','select',['red','wh']],['display_order','Order','number']]},
  awards:{label:'Awards',title:'title',sub:'description',order:'display_order',f:[['title','Title'],['description','Description','textarea'],['level','Level (e.g. STATE, U19)'],['display_order','Order','number']]},
  skills:{label:'Skills',title:'name',sub:'category',order:'category',f:[['name','Skill name'],['category','Category','select',['crk','ai','dev','mk','bz']],['color','Color (e.g. #8fd0ff)'],['size','Size (12 - 26)','number']]},
  messages:{label:'Messages',title:'name',sub:'message',order:'created_at',desc:true,readonly:true,f:[]}
};
let cur = 'profiles', editing = null, rows = [];

function say(t){ $('msg').textContent = t || ''; }

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  show(!!session);
}
function show(on){
  $('login').hidden = on; $('app').hidden = !on;
  if(on){ buildNav(); go(cur); }
}
$('lbtn').onclick = async () => {
  $('lerr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email:$('em').value.trim(), password:$('pw').value });
  if(error) $('lerr').textContent = error.message; else show(true);
};
$('out').onclick = async () => { await sb.auth.signOut(); show(false); };

function buildNav(){
  $('nav').innerHTML = Object.keys(T).map(k => `<button data-k="${k}" class="${k===cur?'on':''}">${T[k].label}</button>`).join('');
  $('nav').querySelectorAll('button').forEach(b => b.onclick = () => go(b.dataset.k));
}
async function go(k){
  cur = k; editing = null; $('formCard').hidden = true; buildNav();
  $('ltitle').textContent = T[k].label; $('add').hidden = !!T[k].readonly;
  say('Loading...');
  const { data, error } = await sb.from(k).select('*').order(T[k].order, { ascending: !T[k].desc });
  if(error){ say('Error: ' + error.message); return; }
  say(''); rows = data || []; renderList();
}
function renderList(){
  const c = T[cur];
  if(!rows.length){ $('list').innerHTML = '<p style="color:var(--mut)">Abhi kuch nahi hai.</p>'; return; }
  $('list').innerHTML = rows.map((r,i) => `<div class="row"><div><strong>${esc(r[c.title])}</strong>
    <small>${esc(String(r[c.sub] ?? '').slice(0,140))}${c.readonly ? '<br>' + esc(r.email) : ''}</small></div>
    <div class="act">${c.readonly ? '' : `<button class="sec" data-e="${i}">Edit</button>`}<button class="del" data-d="${i}">Delete</button></div></div>`).join('');
  $('list').querySelectorAll('[data-e]').forEach(b => b.onclick = () => openForm(rows[b.dataset.e]));
  $('list').querySelectorAll('[data-d]').forEach(b => b.onclick = () => del(rows[b.dataset.d]));
}
function openForm(row){
  editing = row || null; const c = T[cur];
  $('ftitle').textContent = (row ? 'Edit ' : 'Add ') + c.label;
  $('fields').innerHTML = c.f.map(([k,l,t,x]) => {
    const v = row ? (row[k] ?? '') : '';
    if(t === 'textarea') return `<label>${l}</label><textarea id="f_${k}">${esc(v)}</textarea>`;
    if(t === 'select') return `<label>${l}</label><select id="f_${k}">${x.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
    if(t === 'image') return `<label>${l}</label><img class="pv" id="pv_${k}" src="${esc(v)}" ${v?'':'hidden'}>
      <input type="file" id="up_${k}" accept="image/*"><input id="f_${k}" value="${esc(v)}" placeholder="ya image URL paste karo">`;
    return `<label>${l}</label><input id="f_${k}" type="${t==='number'?'number':'text'}" value="${esc(v)}">`;
  }).join('');
  c.f.filter(x => x[2] === 'image').forEach(([k]) => {
    $('up_'+k).onchange = async e => {
      const file = e.target.files[0]; if(!file) return;
      say('Uploading image...');
      const path = Date.now() + '-' + file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
      const { error } = await sb.storage.from('portfolio').upload(path, file);
      if(error){ say('Upload error: ' + error.message); return; }
      const url = sb.storage.from('portfolio').getPublicUrl(path).data.publicUrl;
      $('f_'+k).value = url; $('pv_'+k).src = url; $('pv_'+k).hidden = false; say('Image uploaded. Ab Save dabao.');
    };
  });
  $('formCard').hidden = false; window.scrollTo({ top:0, behavior:'smooth' });
}
$('add').onclick = () => openForm(null);
$('cancel').onclick = () => { $('formCard').hidden = true; };
$('save').onclick = async () => {
  const c = T[cur], obj = {};
  c.f.forEach(([k,,t]) => { let v = $('f_'+k).value; obj[k] = t === 'number' ? (v === '' ? 0 : Number(v)) : v; });
  say('Saving...');
  let q = c.upsert ? sb.from(cur).upsert(obj, { onConflict:c.upsert })
        : editing ? sb.from(cur).update(obj).eq('id', editing.id)
        : sb.from(cur).insert(obj);
  const { error } = await q;
  if(error){ say('Error: ' + error.message); return; }
  $('formCard').hidden = true; await go(cur); say('Saved!');
};
async function del(r){
  if(!confirm('Pakka delete karna hai?')) return;
  const { error } = await sb.from(cur).delete().eq('id', r.id);
  if(error){ say('Error: ' + error.message); return; }
  go(cur);
}
boot();
</script>
</body>
</html>
